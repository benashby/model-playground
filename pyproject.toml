[project]
name = "model-playground"
version = "0.1.0"
description = "Harness for poking at speech-to-speech models over the Realtime WebSocket protocol"
requires-python = ">=3.12"
dependencies = [
    "websockets>=13.0",
    "numpy>=1.26",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
playground = "playground.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/playground"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
